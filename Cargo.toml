[workspace]
resolver = "2"
members = [
    "tinymachine-ir",
    "tinymachine-config",
    "tinymachine-api",
    "tinymachine-fork",
    "tinymachine-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.lints.clippy]
style = "warn"
correctness = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
opt-level = "z"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
