[package]
name = "tinymachine-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "TinyMachine CLI — minimal code execution sandbox"

[[bin]]
name = "tinymachine"
path = "src/main.rs"

[features]
default = ["wasm"]
wasm = ["tinymachine-fork/wasm"]

[dependencies]
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true

tinymachine-api = { path = "../tinymachine-api" }
tinymachine-config = { path = "../tinymachine-config" }
tinymachine-fork = { path = "../tinymachine-fork", default-features = false }
